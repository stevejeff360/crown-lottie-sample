<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YS Brands — GitHub Pages Sample</title>
<style>
  html, body { margin:0; padding:0; background:#000; color:#d4af37;
    font-family: Georgia, 'Times New Roman', serif; text-align:center; }
  #crown { width:min(520px, 86vw); margin:6vh auto 0; }
  h1 { font-size:1.15rem; letter-spacing:.35em; margin:1.2rem 0 .4rem; font-weight:normal; }
  p { color:#8a8a8a; font-size:.85rem; letter-spacing:.12em; margin:0 1rem 3rem; }
</style>
</head>
<body>
  <div id="crown"></div>
  <h1>YS BRANDS</h1>
  <p>GITHUB PAGES SAMPLE — CROWN LOTTIE, BUILT WITH GLAXNIMATE</p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script>
    lottie.loadAnimation({
      container: document.getElementById('crown'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'crown-lottie-embedded.json'
    });
  </script>
</body>
</html>
